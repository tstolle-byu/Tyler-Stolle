<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        .header {
            margin-bottom: 20px;
        }

        .header a {
            text-decoration: none;
            font-weight: bold;
            color: #c8102e;
            font-size: 1.1em;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #c8102e;
        }

        #joke {
            margin: 20px 0;
            font-size: 1.2em;
            color: #333;
        }

        button {
            background-color: #c8102e;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #a30f24;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">Home</a>
        <a href="scratch.html">| Interests</a>
        <a href="webapp.html">| Game</a>
    </div>

    <div class="container">
        <h1>Random Joke Generator</h1>
        <p id="joke">Click the button to get a laugh!</p>
        <button onclick="generateJoke()">Tell me a joke</button>
    </div>

    <script>
        const jokes = [
            "Why don't skeletons fight each other? They don't have the guts.",
            "I told my wife she was drawing her eyebrows too high. She looked surprised.",
            "What do you call fake spaghetti? An impasta.",
            "Why did the scarecrow win an award? Because he was outstanding in his field.",
            "How do you organize a space party? You planet.",
            "Why can't your nose be 12 inches long? Because then it would be a foot.",
            "Why did the bike fall over? Because it was two-tired."
        ];

        function generateJoke() {
            const randomIndex = Math.floor(Math.random() * jokes.length);
            document.getElementById("joke").textContent = jokes[randomIndex];
        }
    </script>

</body>
</html>
